      uturn_top_level:    [1]            # top 模式 UTurnTop 等级
      top_uturn_window:   [300]
      ratio_roll_mode:    ["immediate"]  # "immediate"=立刻滚；"signal"=等信号（只在 Call Spread 到期且 S < K2 时生效，表示下一个ratio call spread何时开出）
      max_roll_count:     [0]            # 0=不限制
      entry_long:         [0.5]          # Long call delta（ATM，K1）
      entry_short:        [0.25, 0.3]    # Short call delta（OTM，K2）
