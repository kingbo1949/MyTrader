    direction: "LONG"
    start_time: "2024-01-01 00:00:00"
    end_time:   "2026-08-04 00:00:00"
    fixed_params:
      multi_uturn_window: 300
      risk_free_rate: 0.04
      start_time: "2024-01-01 00:00:00"
      end_time:   "2026-08-04 00:00:00"
      sync_signals:
        - code_id: "SMH"
          min_dif_abs: 0.0
        - code_id: "QQQ"
          min_dif_abs: 0.0
    grid:
      uturn_btm_level:     [1]       # 1=SimpleUBtm 2=DbSimpleBtm 3=MixDbSimpleBtm
      min_dif_abs:         [0]
      # ── 初始 call ──────────────────────────────────────────────────
      option_days:         [7, 14]  # 初始 call DTE
      expiry_weekday:      [-1]
      entry_short:         [0.2, 0.3, 0.4]  # 初始 call delta
      # ── 滚仓 call（独立参数）────────────────────────────────────────
      roll_option_days:    [14]   # 滚仓 call DTE
      roll_expiry_weekday: [-1]
      roll_entry_short:    [0.1, 0.2, 0.3]  # 滚仓 call delta（通常更 OTM）
      max_roll_count:      [0]       # 0=不限制滚仓次数
      # ── 共用平仓参数 ─────────────────────────────────────────────────
      cooldown_hours:      [1]
      max_positions:       [4]
      hard_stop_points:    [0]
      early_profit_ratio:  [0.8]     # 总盈亏达到 max_profit 此比例时提前平仓
      early_time_ratio:    [0.1]
      late_profit_ratio:   [0.001]   # 后期：总盈亏达到此比例时平仓
      late_time_ratio:     [0.9]
      stop_loss_ratio:     [0]       # 总亏损超过 max_profit 此比例时平仓（0=不启用）
      # ── 下跌回调展期 ──────────────────────────────────────────────────
      # UTurnBtm 出现时买回 short call，等 UTurnTop 后再重新卖出。
      # dip_close_level=0 表示不启用此功能。
      dip_close_level:    [1]   # 触发买回的 UTurnBtm 等级（0=不启用；1/2/3）
      dip_close_sync:     [true]  # true=同步信号；false=单品种（dip_close_code_id）
      dip_close_code_id:  ["QQQ"]  # 单品种模式下的品种（空串=使用交易标的本身）
      dip_close_window:   [100]  # Level 2/3 使用的窗口大小
      dip_reopen_level:    [1]   # 触发重新开call的 UTurnTop 等级（0=买回后立即展期）
      dip_reopen_sync:     [false]  # true=同步信号；false=单品种（dip_reopen_code_id）
      dip_reopen_code_id:  ["QQQ"]  # 单品种模式下的品种（空串=使用交易标的本身）
      dip_reopen_window:   [100]  # Level 2/3 使用的窗口大小
      dip_roll_option_days: [7,14,21]   # 滚动态 dip 重建 call 到期天数（0=使用 roll_option_days）


