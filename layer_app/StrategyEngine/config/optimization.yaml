  - class: "UTurnBSync_CreditPutSpreadPMCC"
    enable: false
    code_id: "TSM"
    interval: "M5"
    direction: "LONG"
    start_time: "2024-01-01 00:00:00"
    end_time:   "2026-08-04 00:00:00"
    fixed_params:
      multi_uturn_window: 300
      risk_free_rate: 0.04
      initial_capital: 100000
      vix_code_id: "NQ"             # VIX 来源品种（ES/NQ 均返回 VIX，用 NQ 复用已有缓存）
      start_time: "2024-01-01 00:00:00"
      end_time:   "2026-08-04 00:00:00"
      sync_signals:
        - code_id: "SMH"
          min_dif_abs: 0.0
        - code_id: "QQQ"
          min_dif_abs: 0.0
    grid:
      uturn_btm_level:           [1]       # 1=SimpleUBtm 2=DbSimpleBtm 3=MixDbSimpleBtm
      min_dif_abs:               [0]
      # ── Phase 1: 价差参数（跟EX完全一致，Phase1没有任何改动）────────────────
      entry_short:               [0.5]  # 短腿 put delta（K1）
      entry_long:                [0.15, 0.2, 0.3]  # 长腿 put delta（K2）
      option_days:               [7, 14]     # 价差 DTE
      expiry_weekday:            [-1]
      min_net_credit:            [0]
      # ── Phase 1: 价差平仓参数 ──────────────────────────────────────────────
      spread_early_profit_ratio: [0.8]  # 价差收益达到 ratio×net_credit 时止盈
      spread_early_time_ratio:   [0.1]
      min_vix:                   [0]  # 开仓时 VIX 须 ≥ 此值（0=不限制）
      cooldown_hours:            [1]
      max_positions:             [4]
      # ── Phase 2: 滚仓 call 参数 ────────────────────────────────────────────
      roll_entry_short:          [0.2, 0.3]  # 滚仓 call delta
      roll_option_days:          [14,21]    # 滚仓 call DTE
      roll_expiry_weekday:       [-1]
      max_roll_count:            [0]
      profit_roll_wait_reopen:   [true]  # true=买回旧call后裸持等UTurnTop信号(复用dip_reopen_*)才重开
      # ── Phase 2: CC 平仓参数 ───────────────────────────────────────────────
      cc_roll_profit_ratio:      [0.9]       # short call 权利金实现率达此比例时买回展期（0=不启用）
      cc_early_profit_ratio:     [0.8]       # total_pnl ≥ ratio×max_profit（早期）
      cc_early_time_ratio:       [0.1]
      # ── 下跌回调展期 ────────────────────────────────────────────────────────
      dip_close_level:    [1]     # 0=不启用；1=SimpleUBtm；2=DbSimpleBtm；3=MixDbSimpleBtm
      dip_close_sync:     [true]  # true=同步信号；false=单品种（dip_close_code_id）
      dip_close_code_id:  [""]   # 单品种模式下的品种（空串=使用交易标的本身）
      dip_close_window:   [100]
      dip_reopen_level:    [1]     # 0=立即展期；1=SimpleUTop；2=DbSimpleTop；3=MixDbSimpleTop
      dip_reopen_sync:     [false]
      dip_reopen_code_id:  ["QQQ"]
      dip_reopen_window:   [100]
      dip_roll_option_days: [7,14]   # 滚动态 dip 重建 call 到期天数（0=使用 roll_option_days）
      dip_apply_to_spread: [true]  # false=仅CC阶段；true=价差阶段也适用（卖/重买long put）
      dip_reopen_allow_early_profit: [true]  # false=dip_reopen开出的call不参与cc_early_profit提前平仓
      # ── PMCC 专属参数（正股腿替换成深度实值远期call）─────────────────────────
      pmcc_days:            [200]   # long call 到期天数
      pmcc_target_delta:    [0.90]  # 目标|delta|，越接近1越像正股（但权利金越贵）
      pmcc_expiry_weekday:  [-1]
      pmcc_roll_before_days: [30]   # 剩余天数≤此值时主动展期这份long call（0=不启用，退回旧行为）



