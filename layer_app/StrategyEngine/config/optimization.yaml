# config/optimization.yaml
optimizations:
  - class: "UTurnBSync_CreditPutSpread"
    enable: false
    code_id: "ES"
    interval: "M1"
    direction: "LONG"
    start_time: "2024-01-01 00:00:00"
    end_time:   "2026-06-01 00:00:00"
    fixed_params:
      multi_uturn_window: 300
      risk_free_rate: 0.04
      start_time: "2024-01-01 00:00:00"
      end_time:   "2026-06-01 00:00:00"
      sync_signals:
        - code_id: "SMH"
          min_dif_abs: 0.0
        - code_id: "ES"
          min_dif_abs: 0.0
    grid:
      uturn_btm_level:      [1]  # 1=SimpleUBtm 2=DbSimpleBtm 3=MixDbSimpleBtm
      min_dif_abs:          [0]  # 交易标的开仓 bar 的 |dif| 最小值（0=不限制）
      option_days:          [14, 21, 30]
      expiry_weekday:       [-1]
      entry_short:          [0.4, 0.5, 0.6]
      entry_long:           [0.2, 0.3, 0.35]
      cooldown_hours:       [1]
      max_positions:        [4]
      hard_stop_points:     [0]
      price_check_hours:    [0]     # 价格检查：开仓后多少小时做一次性检查（0=不启用）
      min_price_gain_ratio: [0]     # 价格检查：标的涨幅低于此比例则平仓（支持负值）
      early_profit_ratio:   [0.8]
      early_time_ratio:     [0.3]
      late_close_time_ratio: [0]
      min_net_credit:       [0]  # 最低净权利金（低于此值不开仓，0=不限制）

