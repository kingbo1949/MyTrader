  - class: "UTurnBSync_DebitCallSpreadPMCC"
    enable: false
    code_id: "SMH"
    interval: "M5"
    direction: "LONG"
    start_time: "2024-01-01 00:00:00"
    end_time:   "2026-08-04 00:00:00"
    fixed_params:
      multi_uturn_window: 300
      risk_free_rate: 0.04
      initial_capital: 100000
      vix_code_id: "NQ"
      start_time: "2024-01-01 00:00:00"
      end_time:   "2026-08-04 00:00:00"
      sync_signals:
        - code_id: "SMH"
          min_dif_abs: 0.0
        - code_id: "QQQ"
          min_dif_abs: 0.0
    grid:
      uturn_btm_level:           [1]       # 1=SimpleUBtm 2=DbSimpleBtm 3=MixDbSimpleBtm
      min_dif_abs:               [0]
      min_vix:                   [0]
      min_drop_from_prev_close:  [0]  # 当前价须低于昨收此比例才开仓（0=不限制）
      settle_itm_via_exercise:   [false, true]  # false(默认,新版本)=只平short腿；true(老版本)=行权long call覆盖,两腿一起平仓离场
      # ── 开仓：long call（远期，模拟正股）─────────────────────────────────────
      entry_long:                [0.7]  # long call delta，越接近1越像正股（但权利金越贵）
      long_call_days:            [60, 120]
      long_call_expiry_weekday:  [-1]
      long_call_roll_after_days: [15, 30]    # 自开仓/上次展期起已过去此天数时主动展期（0=不启用）
      # ── short call（近期，反复滚动）───────────────────────────────────────────
      roll_entry_short:          [0.3, 0.4]  # 滚仓 call delta
      roll_option_days:          [14]    # 滚仓 call DTE
      roll_expiry_weekday:       [-1]
      max_roll_count:            [0]
      cooldown_hours:            [1]
      max_positions:             [4]
      # ── Dip 参数（UTurnBtm→提前买回short call；UTurnTop→重开，唯一重开路径）──
      dip_close_level:    [1]     # 0=不启用；1=SimpleUBtm；2=DbSimpleBtm；3=MixDbSimpleBtm
      dip_close_sync:     [true]  # true=同步信号；false=单品种（dip_close_code_id）
      dip_close_code_id:  ["QQQ"]
      dip_close_window:   [100]
      dip_reopen_level:    [1,2]    # 本策略不支持立即重开(0)，恒为1/2/3
      dip_reopen_sync:     [false, true]
      dip_reopen_code_id:  ["QQQ"]
      dip_reopen_window:   [100]
      dip_roll_option_days: [7, 14]  # 0=使用 roll_option_days
      dip_close_min_realized_ratio: [0, 0.4, 0.6]  # short call权利金实现率需≥此比例才允许dip_close买回（0=不限制）
      # ── long call ↔ 正股 切换（独立于short call的dip信号；0=不启用） ────────
      long_dip_close_level:    [1]
      long_dip_close_sync:     [true]
      long_dip_close_code_id:  ["QQQ"]
      long_dip_close_window:   [100]
      long_dip_reopen_level:    [1]  # 本策略不支持立即换回(0)，恒为1/2/3
      long_dip_reopen_sync:     [true]
      long_dip_reopen_code_id:  ["QQQ"]
      long_dip_reopen_window:   [100]
      long_dip_reopen_delta:    [0.8]  # 正股换回long call时用的delta，独立于entry_long



