      expiry_weekday:     [-1]
      cooldown_hours:     [1]
      max_positions:      [4]
      # ── Put Spread 参数 ────────────────────────────────────────────────────
      enable_put_spread:  [true]         # 启用 Put Spread 接货
      put_entry_signal:   ["bottom"]     # "bottom"=随正股开仓；"top"=等UTurnTop再开仓
      put_option_days:    [7, 14]        # 0=复用 option_days
      put_entry_long:     [0.5]          # long put |delta|（K_pl，较高行权价）
      put_entry_short:    [0.2, 0.25]    # short put |delta|（K_ps，较低行权价）
      put_roll_mode:      ["immediate", "signal "]  # "immediate"=立刻滚；"signal"=等信号（只在 Put Spread 到期且 S ≥ K_ps 时生效，表示下一个ratio put spread何时开出）
      put_max_roll_count: [0]            # 0=不限制


